<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ledgerline — Sign in</title>
<style>
  :root{--ink:#0c0c0d;--paper:#ffffff;--line:#e3e3e0;--muted:#6b6b6b;--signal:#ff4d00}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:"Inter",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--paper);display:grid;grid-template-columns:1.05fr .95fr}
  /* Left editorial panel */
  .panel{position:relative;background:var(--ink);color:#fff;padding:56px 60px;display:flex;flex-direction:column;
    justify-content:space-between;overflow:hidden}
  .grid-bg{position:absolute;inset:0;opacity:.14;
    background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
    background-size:64px 64px;mask-image:linear-gradient(160deg,#000,transparent 78%)}
  .panel .brand{position:relative;display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
  .mark{width:26px;height:26px;border:2px solid #fff;border-radius:50%;position:relative}
  .mark::after{content:"";position:absolute;inset:5px;background:var(--signal);border-radius:50%}
  .panel h2{position:relative;font-size:clamp(32px,3.4vw,50px);line-height:1.03;letter-spacing:-.035em;
    font-weight:600;margin:0;max-width:11ch}
  .panel h2 em{font-style:normal;color:var(--signal)}
  .panel p{position:relative;color:#a7a7a7;font-size:15px;max-width:36ch;line-height:1.6;margin:20px 0 0}
  .stats{position:relative;display:flex;gap:44px;border-top:1px solid rgba(255,255,255,.16);padding-top:24px}
  .stat b{display:block;font-size:24px;letter-spacing:-.02em}
  .stat span{font-size:12px;color:#8c8c8c;text-transform:uppercase;letter-spacing:.1em}
  /* Right form panel */
  .form-wrap{display:flex;align-items:center;justify-content:center;padding:56px 60px}
  .form{width:100%;max-width:380px}
  .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);margin:0 0 10px}
  h1{font-size:30px;letter-spacing:-.03em;margin:0 0 34px;font-weight:600}
  .field{margin-bottom:26px}
  .field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:8px}
  input[type=email],input[type=password],input[type=text]{
    width:100%;border:0;border-bottom:1.5px solid var(--line);background:transparent;
    padding:8px 2px;font-size:16px;color:var(--ink);outline:none;transition:border-color .2s}
  input::placeholder{color:#b8b8b8}
  input:focus{border-color:var(--ink)}
  .pw{position:relative}
  .pw button{position:absolute;right:0;top:6px;background:none;border:0;cursor:pointer;font-size:12px;
    text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
  .pw button:hover{color:var(--signal)}
  .row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;margin:6px 0 30px}
  .check{display:flex;align-items:center;gap:9px;color:var(--muted);cursor:pointer}
  .check input{accent-color:var(--signal)}
  a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
  a:hover{border-color:var(--signal);color:var(--signal)}
  .primary{width:100%;padding:15px;border:0;background:var(--ink);color:#fff;font-size:15px;font-weight:600;
    letter-spacing:.01em;cursor:pointer;transition:background .2s}
  .primary:hover{background:var(--signal)}
  .alt{display:flex;gap:12px;margin-top:16px}
  .alt button{flex:1;padding:13px;background:#fff;border:1.5px solid var(--line);font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:9px;transition:border-color .2s,background .2s}
  .alt button:hover{border-color:var(--ink);background:#fafafa}
  .foot{margin-top:34px;font-size:13.5px;color:var(--muted)}
  .or{display:flex;align-items:center;gap:12px;color:#a0a0a0;font-size:11px;text-transform:uppercase;
    letter-spacing:.14em;font-size:12px;margin:28px 0 4px}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  :focus-visible{outline:2px solid var(--signal);outline-offset:3px}
  @media(max-width:900px){body{grid-template-columns:1fr}.panel{display:none}.form-wrap{padding:44px 24px}}
</style>
</head>
<body>
  <section class="panel">
    <div class="grid-bg"></div>
    <div class="brand"><span class="mark"></span>Ledgerline</div>
    <div>
      <h2>Numbers you can <em>actually</em> trust.</h2>
      <p>Real-time revenue, churn, and runway for finance teams that move fast.</p>
    </div>
    <div class="stats">
      <div class="stat"><b>12,400+</b><span>Teams</span></div>
      <div class="stat"><b>99.99%</b><span>Uptime</span></div>
      <div class="stat"><b>SOC 2</b><span>Type II</span></div>
    </div>
  </section>

  <section class="form-wrap">
    <div class="form">
      <p class="eyebrow">Sign in</p>
      <h1>Welcome back to Ledgerline</h1>

      <form onsubmit="return false">
        <div class="field">
          <label for="e2">Work email</label>
          <input id="e2" type="email" placeholder="name@company.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="p2">Password</label>
          <span class="pw">
            <input id="p2" type="password" placeholder="Enter your password" autocomplete="current-password" />
            <button type="button" onclick="var p=document.getElementById('p2');p.type=p.type==='password'?'text':'password'">Show</button>
          </span>
        </div>
        <div class="row">
          <label class="check"><input type="checkbox" /> Keep me signed in</label>
          <a href="#">Forgot password?</a>
        </div>
        <button class="primary" type="submit">Sign in</button>
      </form>

      <div class="or">or continue with</div>
      <div class="alt">
        <button type="button">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.3-2.1 3.6-5.2 3.6-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1C3.4 21.3 7.4 24 12 24z"/><path fill="#FBBC05" d="M5.4 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.6.4-2.4V6.5H1.4C.5 8.2 0 10 0 12s.5 3.8 1.4 5.5l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4C17.9 1.2 15.2 0 12 0 7.4 0 3.4 2.7 1.4 6.5l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"/></svg>
          Google
        </button>
        <button type="button">SSO</button>
      </div>
      <p class="foot">No account? <a href="#">Request access</a></p>
    </div>
  </section>
</body>
</html>
